name: e2e-url-checker

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  url-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Run URL checker tests
        run: make e2e
